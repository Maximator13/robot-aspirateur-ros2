name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install numpy pytest
      # Modules Python purs : aucun import ROS, le paquet est rendu importable via PYTHONPATH
      - run: python -m pytest src/aspi_bot/test -q
        env:
          PYTHONPATH: src/aspi_bot
