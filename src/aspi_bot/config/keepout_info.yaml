# aspi (robot réel) : serveur d'information du filtre keepout (nav2_map_server costmap_filter_info_server).
# Le masque lui-même est servi par un map_server dédié sur /keepout_filter_mask (maps/keepout.yaml).
costmap_filter_info_server:
  ros__parameters:
    type: 0                                # 0 = keepout (zones interdites)
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0
